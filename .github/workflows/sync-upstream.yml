name: Sync upstream

on:
  schedule:
    - cron: "0 20 * * *" # 04:00 Manila time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: rebase onto upstream
        id: rebase
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/readest/readest.git
          git fetch upstream

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old=$(node -p "require('./apps/readest-app/package.json').version")

          if ! git rebase upstream/main; then
            git rebase --abort
            echo "::error::Rebase conflict, resolve locally"
            exit 1
          fi

          new=$(node -p "require('./apps/readest-app/package.json').version")
          git push --force-with-lease

          if [ "$old" != "$new" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version $old -> $new"

      - name: trigger Android build
        if: steps.rebase.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-android.yml --ref main
